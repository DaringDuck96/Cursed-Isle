<title>Cursed Tides Mob Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a shipwright's drafting table — roster rail | 3D stage | inspector, stacking on phones */
:root {
  --bg: #efe8da; --panel: #f8f3e8; --panel-2: #e7dfcd; --ink: #2b2620; --ink-2: #6b6152;
  --line: #d3c8b2; --accent: #a66a1c; --accent-ink: #fff8ec; --sea: #2f5d6b; --stage: #d9d1bf;
  --ok: #3f7a4a; --warn: #a8761e; --bad: #a3392e;
  --display: "IM Fell English SC", Georgia, serif; --body: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1719; --panel: #152024; --panel-2: #1c2a2f; --ink: #e8e1d2; --ink-2: #9aa59f;
  --line: #2b3b40; --accent: #d39a46; --accent-ink: #1a1308; --sea: #6fb3c4; --stage: #0b1214;
  --ok: #6fbf7d; --warn: #e0b04f; --bad: #e07a6c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1719; --panel: #152024; --panel-2: #1c2a2f; --ink: #e8e1d2; --ink-2: #9aa59f;
  --line: #2b3b40; --accent: #d39a46; --accent-ink: #1a1308; --sea: #6fb3c4; --stage: #0b1214;
  --ok: #6fbf7d; --warn: #e0b04f; --bad: #e07a6c; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 13px; }
.app { display: grid; grid-template-rows: auto 1fr; height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px; gap: 10px; box-sizing: border-box; }
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
header h1 { font-family: var(--display); font-weight: 400; font-size: 26px; margin: 0; letter-spacing: .02em; text-wrap: balance; }
header .sub { color: var(--ink-2); }
header .save { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--ink-2); }
.cols { display: grid; grid-template-columns: 250px minmax(0, 1fr) 350px; gap: 10px; min-height: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.panel h2 { font-family: var(--display); font-weight: 400; font-size: 17px; margin: 0; padding: 10px 12px 6px; }
/* Roster */
.roster input[type=search] { margin: 0 10px 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); font: inherit; }
.roster .list { overflow: auto; padding: 0 6px 10px; }
.group { margin-top: 8px; }
.group > .gh { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-2); padding: 4px 6px; display: flex; justify-content: space-between; }
.mob { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; padding: 5px 6px; border-radius: 4px; cursor: pointer; }
.mob:hover { background: var(--panel-2); }
.mob[aria-current="true"] { background: var(--accent); color: var(--accent-ink); }
.dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--ink-2); flex: none; }
.dot.started { background: var(--warn); border-color: var(--warn); }
.dot.done { background: var(--ok); border-color: var(--ok); }
/* Stage */
.stage { position: relative; background: var(--stage); }
.stage canvas.gl { width: 100%; height: 100%; display: block; touch-action: none; }
.stagebar { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.stagebar > * { pointer-events: auto; }
.title { font-family: var(--display); font-size: 22px; margin-right: auto; color: var(--ink); text-shadow: 0 1px 0 var(--bg); }
.hint { position: absolute; left: 10px; bottom: 8px; color: var(--ink-2); font-size: 11px; pointer-events: none; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: 12px; padding: 5px 9px; border-radius: 4px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.on, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn:focus-visible, .mob:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--sea); outline-offset: 1px; }
/* Inspector */
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; border: 0; background: none; color: var(--ink-2); font: inherit; padding: 9px 4px; cursor: pointer; border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
.tabpane { overflow: auto; padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.tabpane > * { flex: none; }
[hidden] { display: none !important; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
label.f { display: grid; gap: 3px; font-size: 11px; color: var(--ink-2); }
label.f input, label.f select, .num { font: inherit; font-family: var(--mono); font-size: 12px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 3px; padding: 4px 5px; min-width: 0; }
.trio { display: grid; grid-template-columns: 52px repeat(3, minmax(0, 1fr)); gap: 4px; align-items: center; }
.trio span { font-size: 11px; color: var(--ink-2); }
.tree { border: 1px solid var(--line); border-radius: 4px; max-height: 210px; overflow: auto; background: var(--bg); }
.node { display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font-family: var(--mono); font-size: 12px; padding: 3px 6px; cursor: pointer; }
.node:hover { background: var(--panel-2); }
.node[aria-current="true"] { background: var(--sea); color: var(--bg); }
.cube { border: 1px solid var(--line); border-radius: 4px; padding: 6px; display: grid; gap: 4px; }
.cube.sel { border-color: var(--accent); }
.cube header { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
.cube header .btn { padding: 2px 6px; font-size: 11px; }
.sect { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); margin-top: 4px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
.sw { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--ink-2); }
.sw input[type=color] { width: 26px; height: 22px; border: 1px solid var(--line); padding: 0; background: none; }
.texwrap { border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 360px; background:
  repeating-conic-gradient(var(--panel-2) 0% 25%, var(--panel) 0% 50%) 50% / 12px 12px; }
.texwrap canvas { display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
textarea.code { width: 100%; box-sizing: border-box; min-height: 220px; font-family: var(--mono); font-size: 11px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; resize: vertical; }
.note { color: var(--ink-2); font-size: 12px; line-height: 1.45; max-width: 60ch; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 12px; }
.kv dt { color: var(--ink-2); } .kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.confirm { border: 1px solid var(--bad); border-radius: 4px; padding: 8px; display: grid; gap: 6px; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 12px; border-radius: 4px; font-size: 12px; z-index: 20; }
@media (max-width: 1100px) { .cols { grid-template-columns: 220px minmax(0, 1fr); } .inspector { grid-column: 1 / -1; max-height: 70vh; } }
@media (max-width: 720px) { .app { height: auto; } .cols { grid-template-columns: minmax(0, 1fr); } .roster { max-height: 240px; } .stage { height: 60vh; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header>
    <h1>Cursed Tides Mob Workshop</h1>
    <span class="sub">Build, paint and export every creature, character, boss and ship in the Reach.</span>
    <span class="save" id="saveState">Not saved yet</span>
  </header>
  <div class="cols">
    <section class="panel roster" aria-label="Mobs">
      <h2>The roster</h2>
      <input type="search" id="search" placeholder="Find a mob…" aria-label="Find a mob">
      <div class="list" id="roster"></div>
    </section>

    <section class="panel stage" aria-label="Model preview">
      <canvas class="gl" id="gl"></canvas>
      <div class="stagebar">
        <span class="title" id="mobTitle">—</span>
        <button class="btn on" id="btnAnim" type="button">Animate</button>
        <button class="btn" id="btnFront" type="button">Front</button>
        <button class="btn" id="btnSide" type="button">Side</button>
        <button class="btn" id="btnTop" type="button">Top</button>
        <button class="btn" id="btnPaint3d" type="button" title="Click and drag on the model to paint">Paint on model</button>
      </div>
      <div class="hint" id="hint">Drag to turn · wheel or pinch to zoom · click a part to select it</div>
    </section>

    <section class="panel inspector" aria-label="Inspector">
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="parts" type="button">Parts</button>
        <button role="tab" aria-selected="false" data-tab="paint" type="button">Paint</button>
        <button role="tab" aria-selected="false" data-tab="export" type="button">Export</button>
      </div>
      <div class="tabpane" id="pane-parts"></div>
      <div class="tabpane" id="pane-paint" hidden></div>
      <div class="tabpane" id="pane-export" hidden></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

   Small helpers
   ====================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const clone = (o) => JSON.parse(JSON.stringify(o));
const hex2rgb = (h) => { h = h.replace("#", ""); if (h.length === 3) h = h.split("").map(c => c + c).join(""); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const shade = (rgb, f) => rgb.map(c => Math.max(0, Math.min(255, Math.round(f >= 0 ? c + (255 - c) * f : c * (1 + f)))));
function hash(a, b, c) { let h = (a * 374761393 + b * 668265263 + c * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
let toastTimer;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2600); }

/* ======================================================================
   Model generators. Coordinates are Minecraft model pixels: y grows downward,
   the feet stand at y 24, the front faces -z (ships: bow at +z).
   Part names follow the mod's animation rules.
   ====================================================================== */
const part = (name, parent, pivot, rot, cubes) => ({ name, parent: parent || null, pivot: pivot || [0, 0, 0], rot: rot || [0, 0, 0], cubes });
const cube = (o, s, pat, col, extra) => Object.assign({ o, s, uv: [0, 0], inflate: 0, mirror: false, pat, col }, extra || {});

function biped(opt) {
  const sk = opt.kind === "skeleton", dr = opt.kind === "drowned", brute = opt.build === "brute";
  const flesh = sk ? "bone" : "skin";
  const limb = sk ? 2 : brute ? 5 : opt.female ? 3 : 4;
  const parts = [];
  const head = [cube([-4, -8, -4], [8, 8, 8], sk ? "skull" : "head", flesh)];
  if (opt.beard && !sk) head.push(cube([-4, -2, -4.6], [8, 3, 1], "beard", "hair"));
  parts.push(part("head", null, [0, 0, 0], [0, 0, 0], head));
  const hat = [];

    for (const [fx, fy, fw, fh] of Object.values(faceRects(cb))) g.strokeRect(fx * z + 1, fy * z + 1, fw * z - 2, fh * z - 2);
  });
}
function hookTexEditor() {
  const c = $("#texEd"); let down = false;
  const at = (e) => { const r = c.getBoundingClientRect(); const z = c.width / texCanvas.width; return [Math.floor((e.clientX - r.left) * (c.width / r.width) / z), Math.floor((e.clientY - r.top) * (c.height / r.height) / z)]; };
  c.addEventListener("pointerdown", (e) => { c.setPointerCapture(e.pointerId); down = true; pushUndo(); const [x, y] = at(e); setPixel(x, y, brush.color, brush.size); texture.needsUpdate = true; drawTexEditor(); });
  c.addEventListener("pointermove", (e) => { if (!down || brush.tool === "fill" || brush.tool === "pick") return; const [x, y] = at(e); setPixel(x, y, brush.color, brush.size); texture.needsUpdate = true; drawTexEditor(); });
  c.addEventListener("pointerup", () => { if (down) { down = false; afterTextureEdit(); } });
}

/* Export pane */
function className() { return proj.id.split(/[_\s]+/).map(s => s[0].toUpperCase() + s.slice(1)).join("") + "Model"; }
const f = (v) => { const r = Math.round(v * 1000) / 1000; return (Number.isInteger(r) ? r + ".0" : String(r)) + "f"; };
function javaCode() {
  const m = proj.model, lines = [];
  const vars = {}; let k = 0;
  const ordered = []; const visit = (parent) => { for (const p of m.parts.filter(x => (x.parent || null) === parent)) { ordered.push(p); visit(p.name); } }; visit(null);
  for (const p of m.parts) if (!ordered.includes(p)) ordered.push(p);
  for (const p of ordered) {
    const v = p.name.replace(/[^a-zA-Z0-9]/g, "_") + "_" + (k++); vars[p.name] = v;
    let chain = "ModelPartBuilder.create()", mirrored = false;
    for (const c of p.cubes) {
      if (!!c.mirror !== mirrored) { chain += c.mirror ? ".mirrored()" : ".mirrored(false)"; mirrored = !!c.mirror; }
      chain += `.uv(${c.uv[0]}, ${c.uv[1]}).cuboid(${c.o.map(f).join(", ")}, ${c.s.map(f).join(", ")}${c.inflate ? `, new Dilation(${f(c.inflate)})` : ""})`;
    }
    const rad = p.rot.map(d => d * Math.PI / 180);
    const tr = rad.every(r => r === 0) ? `ModelTransform.pivot(${p.pivot.map(f).join(", ")})` : `ModelTransform.of(${p.pivot.map(f).join(", ")}, ${rad.map(f).join(", ")})`;
    const parentVar = p.parent && vars[p.parent] ? vars[p.parent] : "root";
    lines.push(`        ModelPartData ${v} = ${parentVar}.addChild("${p.name}", ${chain}, ${tr});`);
  }
  return `// ${proj.name}: made in the Cursed Tides Mob Workshop
// Texture: textures/entity/${proj.id}.png (${m.tex[0]} x ${m.tex[1]})
package com.cursedtides.client.models;

import net.minecraft.client.model.*;

public final class ${className()} {
    private ${className()}() {}

    /** Part paths, for the mod's CreatureModel (which animates parts by name). */
    public static final String[] PARTS = {${pathsList().map(s => `"${s}"`).join(", ")}};

    public static TexturedModelData getTexturedModelData() {
        ModelData data = new ModelData();
        ModelPartData root = data.getRoot();
${lines.join("\n")}
        return TexturedModelData.of(data, ${m.tex[0]}, ${m.tex[1]});
    }
}
`;
}
function pathsList() {
  const byName = Object.fromEntries(proj.model.parts.map(p => [p.name, p]));
  return proj.model.parts.map(p => { const path = [p.name]; let cur = p; let g = 0; while (cur.parent && byName[cur.parent] && g++ < 30) { cur = byName[cur.parent]; path.unshift(cur.name); } return path.join("/"); });
}
function projectJson() { return JSON.stringify({ id: proj.id, name: proj.name, model: proj.model, palette: proj.palette, notes: proj.notes, texture: texCanvas.toDataURL("image/png"), workshop: 1 }, null, 1); }
function canvasBlob() { return new Promise(res => texCanvas.toBlob(res, "image/png")); }
async function offer(filename, data) {
  if (!dlCap) { toast("Saving files isn't available here. Use Copy instead."); return; }
  try { const r = await dlCap.save({ filename, data }); if (r.status === "saved") toast("Saved " + filename); }
  catch (e) { if (e.code !== "declined") toast(e.code === "rate_limited" ? "A save is already waiting for you" : "Couldn't save the file (" + e.code + ")"); }
}
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(what + " copied"); }
  catch { const ta = $("#javaOut"); if (ta) { ta.focus(); ta.select(); } toast("Select the text and copy it"); }
}
function renderExport() {
  const pane = $("#pane-export"); pane.replaceChildren();
  if (!proj) return;
  const cubes = proj.model.parts.reduce((a, p) => a + p.cubes.length, 0);
  const status = el("select", { "aria-label": "Status" }, ...[["started", "In progress"], ["done", "Done"]].map(([v, t]) => el("option", { value: v, text: t, selected: proj.status === v ? "" : false })));
  status.addEventListener("change", () => { proj.status = status.value; statusMap[proj.id] = proj.status; renderRoster(); scheduleSave(); });
  const notes = el("textarea", { class: "code", style: "min-height:70px;font-family:var(--body)", "aria-label": "Notes", placeholder: "Notes for whoever finishes this model…" }); notes.value = proj.notes || "";
  notes.addEventListener("change", () => { proj.notes = notes.value; scheduleSave(); });
  pane.append(el("dl", { class: "kv" },
    el("dt", { text: "Parts" }), el("dd", { text: String(proj.model.parts.length) }),
    el("dt", { text: "Cubes" }), el("dd", { text: String(cubes) }),
    el("dt", { text: "Texture" }), el("dd", { text: proj.model.tex.join(" × ") + " px" }),
    el("dt", { text: "Class" }), el("dd", { text: className() })),
    el("label", { class: "f" }, "Status", status), el("label", { class: "f" }, "Notes", notes));
  pane.append(el("div", { class: "sect", text: "Files for the mod" }), el("div", { class: "row" },
    el("button", { class: "btn primary", type: "button", onclick: async () => {
      if (!window.JSZip) { toast("The zip library didn't load"); return; }
      const z = new JSZip(); z.file(className() + ".java", javaCode()); z.file(proj.id + ".png", await canvasBlob()); z.file(proj.id + ".workshop.json", projectJson());
      offer(proj.id + "-model.zip", await z.generateAsync({ type: "blob" }));
    } }, "Download pack (.zip)"),
    el("button", { class: "btn", type: "button", onclick: async () => offer(proj.id + ".png", await canvasBlob()) }, "Texture (.png)"),
    el("button", { class: "btn", type: "button", onclick: () => offer(proj.id + ".workshop.json", projectJson()) }, "Project file (.json)")));
  const imp = el("input", { type: "file", accept: ".json,application/json", "aria-label": "Open a project file" });
  imp.addEventListener("change", async () => {
    const file = imp.files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text()); if (!d.model || !d.model.parts) throw new Error("not a project");
      pushUndo(); proj.model = d.model; if (d.palette) proj.palette = Object.assign(proj.palette, d.palette); proj.notes = d.notes || proj.notes;
      const [W, H] = proj.model.tex; texCanvas.width = W; texCanvas.height = H;
      if (d.texture) { const img = new Image(); await new Promise(r => { img.onload = r; img.onerror = r; img.src = d.texture; }); texCtx.clearRect(0, 0, W, H); texCtx.drawImage(img, 0, 0); } else regenerateTexture();
      afterChange(true); toast("Project opened into " + proj.name);
    } catch { toast("That file isn't a workshop project"); }
    imp.value = "";
  });
  pane.append(el("label", { class: "f" }, "Open a project file into this mob", imp));
  const ta = el("textarea", { class: "code", id: "javaOut", readonly: "", "aria-label": "Java model code" }); ta.value = javaCode();
  pane.append(el("div", { class: "row" }, el("span", { class: "sect", text: "Java model (Fabric 1.21, Yarn)" }),
    el("button", { class: "btn", type: "button", onclick: () => copy(javaCode(), "Java model") }, "Copy")), ta);
  const reset = el("button", { class: "btn danger", type: "button", onclick: () => {
    if (pane.querySelector(".confirm")) return;
    const box = el("div", { class: "confirm" }, el("span", { text: "Start this mob over from its template? Your changes to it are lost (Undo still works until you switch mobs)." }),
      el("div", { class: "row" }, el("button", { class: "btn danger", type: "button", onclick: () => { pushUndo(); const fresh = buildTemplate(entry); proj.model = fresh.model; proj.palette = fresh.palette; regenerateTexture(); afterChange(true); } }, "Start over"),
        el("button", { class: "btn", type: "button", onclick: () => box.remove() }, "Cancel")));
    pane.append(box);
  } }, "Start over from template");
  pane.append(el("p", { class: "note", text: "Everything you build here is kept in this workshop, so Claude can read it straight back into the mod. The zip holds the Java model, the texture and this project." }), reset);
}

/* Tabs, toolbar, keys */
for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => {
  for (const x of document.querySelectorAll(".tabs button")) x.setAttribute("aria-selected", x === b ? "true" : "false");
  for (const k of ["parts", "paint", "export"]) $("#pane-" + k).hidden = k !== b.dataset.tab;
  if (b.dataset.tab === "paint") drawTexEditor();
  if (b.dataset.tab === "export") renderExport();
});
$("#btnAnim").addEventListener("click", (e) => { animOn = !animOn; e.target.classList.toggle("on", animOn); });
$("#btnFront").addEventListener("click", () => frame(Math.PI, 0.05));
$("#btnSide").addEventListener("click", () => frame(Math.PI / 2, 0.05));
$("#btnTop").addEventListener("click", () => frame(Math.PI, 1.35));
$("#btnPaint3d").addEventListener("click", (e) => { paint3d = !paint3d; e.target.classList.toggle("on", paint3d); $("#hint").textContent = paint3d ? "Painting on the model with the Paint tab's brush · two fingers or wheel to zoom" : "Drag to turn · wheel or pinch to zoom · click a part to select it"; });
document.addEventListener("keydown", (e) => {
  if (e.target.matches("input, textarea, select")) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); doRedo(); }
});

/* ======================================================================
   Start
   ====================================================================== */
async function start() {
  try { statusMap = JSON.parse(LS.get("mobws:status") || "{}"); } catch { statusMap = {}; }
  renderRoster();
  animate();
  await openMob(LS.get("mobws:last") && ROSTER.some(m => m.id === LS.get("mobws:last")) ? LS.get("mobws:last") : "cursed_captain");
  if (window.claude && window.claude.use) {
    window.claude.use("downloads").then(d => { dlCap = d; }).catch(() => {});
    window.claude.use("db").then(async d => {
      if (!d) return;
      db = d;
      try {
        const qs = await db.collection("models").get();
        for (const doc of qs.docs) { const v = doc.data(); if (v && v.status) statusMap[doc.id] = v.status; }
        renderRoster();
        // If this mob already has work saved in the workshop, show that instead of the fresh template
        const saved = await loadProject(proj.id);
        if (saved && saved.model && (saved.updated || 0) > 0 && JSON.stringify(saved.model) !== JSON.stringify(proj.model)) await openMob(proj.id);
      } catch { /* keep working locally */ }
    }).catch(() => {});
  }
}
start();
</script>
