name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Export the compile classpath (once)
        shell: bash
        run: |
          if git ls-remote --exit-code origin classpath >/dev/null 2>&1; then echo "classpath branch exists"; exit 0; fi
          chmod +x gradlew
          ./gradlew exportClasspath --no-daemon
          mkdir -p cp-out && cp build/cp/*.jar cp-out/ && ls cp-out | wc -l && du -sh cp-out
          cd cp-out
          git init -q
          git checkout -q -b classpath
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "Compile classpath"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" classpath

      - name: Build the mod
        id: build
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon > build.log 2>&1
          code=$?
          tail -n 80 build.log
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Start a server and let it run (smoke test)
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nenable-rcon=true\nrcon.password=smoketest\nrcon.port=25575\nlevel-type=cursedtides\\:archipelago\nlevel-seed=12345\nspawn-protection=0\nmax-tick-time=-1\n' > run/server.properties
          (timeout 600 ./gradlew runServer --no-daemon > server-run.log 2>&1 &)
          for i in $(seq 1 100); do
            if grep -q "Done (" run/logs/latest.log 2>/dev/null; then echo "server is up"; break; fi
            if grep -q "BUILD FAILED\|Crash report\|Exception in thread \"main\"" server-run.log 2>/dev/null; then echo "server failed"; break; fi
            sleep 5
          done
          # Generate every island so all the world-building code runs
          python3 .github/scripts/rcon.py smoketest "forceload add -34 -34 34 34" "forceload add 168 -92 292 32" "forceload add 30 200 110 280" "forceload add -274 86 -146 214" "forceload add -162 -302 -58 -198" "forceload add 384 124 476 216" "forceload add -380 -100 -260 20" "forceload add 360 -260 480 -140" "forceload add 108 -372 192 -288" "forceload add -116 364 -4 476" "forceload add -466 -326 -374 -234" "forceload add 254 354 346 446" "forceload add 536 -84 664 44" "forceload add 134 514 226 606" "forceload add -610 70 -510 170" "forceload add -8 -608 88 -512" "forceload add -288 -538 -212 -462" "forceload add -384 366 -276 474" "forceload add -90 -770 10 -670" "forceload add 720 290 800 370" "forceload add -668 -208 -572 -112" "forceload add -764 556 -636 684" "forceload add 416 636 544 764" "forceload add 838 -462 962 -338" "forceload add 762 -118 878 -2" "forceload add -64 1036 64 1164" "forceload add -534 796 -406 924" "forceload add -982 -762 -898 -678" "forceload add 1088 268 1192 372" "forceload add 688 -892 752 -828" > rcon.log 2>&1
          python3 .github/scripts/rcon.py smoketest "time set midnight" "weather thunder" "summon cursedtides:tentacle 0 64 60" "summon cursedtides:grenade 0 80 0" "summon cursedtides:story_npc 2 70 2" "summon minecraft:zombie -230 100 -40" "summon minecraft:skeleton 0 80 1100" "damage @e[type=zombie,limit=1] 3 minecraft:generic" "data get entity @e[type=zombie,limit=1] Tags" "data get entity @e[type=zombie,limit=1] CustomName" "data get entity @e[type=zombie,limit=1] Health" "data get entity @e[type=skeleton,limit=1] CustomName" "gamerule keepInventory" "list" >> rcon.log 2>&1
          sleep 90
          python3 .github/scripts/rcon.py smoketest "forceload remove all" "save-all" >> rcon.log 2>&1
          sleep 10
          pkill -f KnotServer; pkill -f runServer; sleep 5; pkill -9 -f java
          mkdir -p ci-out
          cp server-run.log ci-out/ 2>/dev/null
          cp rcon.log ci-out/ 2>/dev/null
          cp run/logs/latest.log ci-out/server.log 2>/dev/null
          cp -r run/crash-reports ci-out/ 2>/dev/null
          if grep -q "Done (" run/logs/latest.log 2>/dev/null; then echo up > ci-out/SERVER; else echo down > ci-out/SERVER; fi

      - name: Publish the log and jar to the build-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ || true
          cp build/libs/*.jar ci-out/ 2>/dev/null || true
          echo "${{ steps.build.outputs.status }}" > ci-out/STATUS
          echo "$GITHUB_SHA" > ci-out/COMMIT
          cd ci-out
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "Build of $GITHUB_SHA (exit ${{ steps.build.outputs.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - name: Upload the mod jar
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cursed-tides
          path: build/libs/*.jar

      - name: Fail if the build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
