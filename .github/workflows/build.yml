name: Build

on:
  push:
    branches: [main, port]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the mod
        id: build
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew build --stacktrace --no-daemon > build.log 2>&1
          code=$?
          tail -n 80 build.log
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Start a server and let it run (smoke test)
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set +e
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf 'online-mode=false\nenable-rcon=true\nrcon.password=smoketest\nrcon.port=25575\nlevel-type=cursedtides\\:archipelago\nlevel-seed=12345\nspawn-protection=0\nmax-tick-time=-1\n' > run/server.properties
          (timeout 600 ./gradlew runServer --no-daemon > server-run.log 2>&1 &)
          for i in $(seq 1 100); do
            if grep -q "Done (" run/logs/latest.log 2>/dev/null; then echo "server is up"; break; fi
            if grep -q "BUILD FAILED\|Crash report\|Exception in thread \"main\"" server-run.log 2>/dev/null; then echo "server failed"; break; fi
            sleep 5
          done
          # Generate every island so all the world-building code runs
          python3 .github/scripts/rcon.py smoketest "forceload add -56 -56 56 56" "forceload add -16 -97 16 -65" "forceload add 498 -178 698 22" "forceload add 582 -242 614 -210" "forceload add -1698 3646 -1586 3758" "forceload add -5618 2386 -5506 2498" "forceload add -5578 2273 -5546 2305" "forceload add -4218 -3214 -4106 -3102" "forceload add -4178 -3299 -4146 -3267" "forceload add 3298 2622 3498 2822" "forceload add 3382 2596 3414 2628" "forceload add -7158 -274 -7046 -162" "forceload add -7118 -377 -7086 -345" "forceload add 3158 -2558 3358 -2358" "forceload add 3242 -2617 3274 -2585" "forceload add -622 -4378 -422 -4178" "forceload add -538 -4395 -506 -4363" "forceload add -3518 6166 -3406 6278" "forceload add -3478 6072 -3446 6104" "forceload add -8558 -3634 -8446 -3522" "forceload add -8518 -3704 -8486 -3672" "forceload add 1522 5886 1634 5998" "forceload add 1562 5816 1594 5848" "forceload add 5678 -38 5878 162" "forceload add 5762 -112 5794 -80" "forceload add -158 8126 -46 8238" "forceload add -10562 1922 -10362 2122" "forceload add -10478 1886 -10446 1918" "forceload add -2118 -7554 -2006 -7442" "forceload add -2078 -7628 -2046 -7596" "forceload add -6178 -6714 -6066 -6602" "forceload add -6138 -6765 -6106 -6733" "forceload add -7298 6166 -7186 6278" "forceload add -7258 6077 -7226 6109" "forceload add -3282 -9838 -3082 -9638" "forceload add -3198 -9874 -3166 -9842" "forceload add 7962 4906 8074 5018" "forceload add 8002 5042 8034 5074" "forceload add -11402 -1998 -11202 -1798" "forceload add -11318 -2028 -11286 -1996" "forceload add -12478 8966 -12366 9078" "forceload add -12438 8834 -12406 8866" "forceload add 4042 10086 4154 10198" "forceload add 4082 9935 4114 9967" "forceload add 9922 -5314 10034 -5202" "forceload add 8758 -598 8958 -398" "forceload add 8842 -652 8874 -620" "forceload add -2678 15686 -2566 15798" "forceload add -2638 15573 -2606 15605" "forceload add -9258 12326 -9146 12438" "forceload add -15838 -9794 -15726 -9682" "forceload add -15798 -9855 -15766 -9823" "forceload add 13282 4766 13394 4878" "forceload add 13322 4681 13354 4713" "forceload add 7402 -11754 7514 -11642" "forceload add 7442 -11791 7474 -11759" > rcon.log 2>&1
          python3 .github/scripts/rcon.py smoketest "time set midnight" "weather thunder" "summon cursedtides:tentacle 0 64 120" "summon cursedtides:grenade 0 80 0" "summon cursedtides:story_npc 2 70 2" "summon minecraft:zombie -7102 100 -218" "summon minecraft:skeleton -2622 120 15742" "damage @e[type=zombie,limit=1] 3 minecraft:generic" "data get entity @e[type=zombie,limit=1] Tags" "data get entity @e[type=zombie,limit=1] CustomName" "data get entity @e[type=zombie,limit=1] Health" "data get entity @e[type=skeleton,limit=1] CustomName" "summon cursedtides:cursed_pirate 600 90 -80" "data get entity @e[type=cursedtides:cursed_pirate,limit=1] CustomName" "gamerule keep_inventory" "list" >> rcon.log 2>&1
          sleep 150
          python3 .github/scripts/rcon.py smoketest "forceload remove all" "save-all" >> rcon.log 2>&1
          sleep 10
          pkill -f KnotServer; pkill -f runServer; sleep 5; pkill -9 -f java
          mkdir -p ci-out
          cp server-run.log ci-out/ 2>/dev/null
          cp rcon.log ci-out/ 2>/dev/null
          cp run/logs/latest.log ci-out/server.log 2>/dev/null
          cp -r run/crash-reports ci-out/ 2>/dev/null
          if grep -q "Done (" run/logs/latest.log 2>/dev/null; then echo up > ci-out/SERVER; else echo down > ci-out/SERVER; fi

      - name: Publish the log and jar to the build-output branch
        if: always()
        shell: bash
        run: |
          mkdir -p ci-out
          cp build.log ci-out/ || true
          cp build/libs/*.jar ci-out/ 2>/dev/null || true
          echo "${{ steps.build.outputs.status }}" > ci-out/STATUS
          echo "$GITHUB_SHA" > ci-out/COMMIT
          cd ci-out
          git init -q
          git checkout -q -b build-output
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "Build of $GITHUB_SHA (exit ${{ steps.build.outputs.status }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" build-output

      - name: Upload the mod jar
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: cursed-tides
          path: build/libs/*.jar

      - name: Fail if the build failed
        if: steps.build.outputs.status != '0'
        run: exit 1
