name: Port helpers

on:
  push:
    branches: [port]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Translate the source to Mojang's names (still on 1.21.1)
        shell: bash
        run: |
          set +e
          chmod +x gradlew
          ./gradlew migrateMappings --mappings "net.minecraft:mappings:1.21.1" --no-daemon > migrate.log 2>&1
          echo "exit $?"
          tail -n 40 migrate.log
          mkdir -p out
          cp migrate.log out/
          if [ -d remappedSrc ]; then cp -r remappedSrc out/remappedSrc; fi
          cd out
          git init -q
          git checkout -q -b port-mojmap
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "Mojang-named source of $GITHUB_SHA"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" port-mojmap

  classpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - name: Export the 26.3 compile classpath
        shell: bash
        run: |
          set +e
          git clone -q --depth 1 -b 26.3 https://github.com/FabricMC/fabric-example-mod.git fem
          cd fem
          cat >> build.gradle <<'GRADLE'

          tasks.register('exportClasspath', Copy) {
              from sourceSets.main.compileClasspath
              from sourceSets.client.compileClasspath
              into layout.buildDirectory.dir('cp')
          }
          GRADLE
          sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/' gradle.properties
          chmod +x gradlew
          ./gradlew exportClasspath --no-daemon > ../cp.log 2>&1
          echo "exit $?"
          tail -n 30 ../cp.log
          mkdir -p ../cpout && cp build/cp/*.jar ../cpout/ 2>/dev/null; cp ../cp.log ../cpout/
          ls ../cpout | wc -l; du -sh ../cpout
          # Sources too, for reading the new code
          ./gradlew genSources --no-daemon > ../gs.log 2>&1
          find ~/.gradle .gradle -name "*sources*.jar" -path "*minecraft*" 2>/dev/null | head -5
          for f in $(find ~/.gradle .gradle -name "*-sources.jar" -path "*minecraft*" 2>/dev/null | head -3); do cp "$f" ../cpout/; done
          cd ../cpout
          git init -q
          git checkout -q -b classpath-263
          git add -A
          git -c user.name="build bot" -c user.email="build-bot@users.noreply.github.com" commit -qm "26.3 compile classpath"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" classpath-263
